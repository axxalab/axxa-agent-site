# Mesmo comportamento da produção: endereços limpos (/privacy -> privacy.html),
# 404 próprio e os cabeçalhos de segurança de public/_headers.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  charset utf-8;

  add_header Content-Security-Policy "default-src 'self'; img-src 'self'; style-src 'self'; font-src 'self'; script-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

  location / {
    try_files $uri $uri.html $uri/ =404;
  }
  location ~* \.(?:css|woff2|png|jpg|gif|webp|svg)$ {
    add_header Cache-Control "public, max-age=3600";
    add_header X-Content-Type-Options "nosniff" always;
  }
  error_page 404 /404.html;
  location = /_headers { return 404; }
}
